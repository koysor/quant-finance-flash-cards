# Quantitative Finance Flash Cards — nginx configuration
# Place this file at /etc/nginx/sites-available/flashcards
# Enable with: ln -s /etc/nginx/sites-available/flashcards /etc/nginx/sites-enabled/

# Rate-limit zones (defined in http context, outside server block)
limit_req_zone $binary_remote_addr zone=graph_zone:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=formula_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=write_zone:10m   rate=5r/m;

# Shared proxy cache — stored on disk, survives nginx reload
proxy_cache_path /var/cache/nginx/flashcards
    levels=1:2
    keys_zone=flashcards_cache:10m
    max_size=50m
    inactive=2h
    use_temp_path=off;

upstream flashcards {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    # Replace with your actual domain:
    server_name example.com www.example.com;

    # Redirect HTTP → HTTPS in production:
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/flashcards_access.log;
    error_log  /var/log/nginx/flashcards_error.log;

    # Serve the app's static files directly — gunicorn never sees these.
    # Replace /opt/flashcards with your actual deployment path.
    location /static/ {
        alias /opt/flashcards/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Cache /search-data.json at the nginx layer — zero gunicorn hits on a warm cache.
    location = /search-data.json {
        proxy_pass             http://flashcards;
        proxy_cache            flashcards_cache;
        proxy_cache_valid      200 24h;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_lock       on;
        add_header             X-Cache-Status $upstream_cache_status;
        include                /etc/nginx/proxy_params;
    }

    # Rate-limited routes
    location = /graph {
        limit_req zone=graph_zone burst=3 nodelay;
        proxy_pass http://flashcards;
        include    /etc/nginx/proxy_params;
    }

    location = /formulas {
        limit_req zone=formula_zone burst=5 nodelay;
        proxy_pass http://flashcards;
        include    /etc/nginx/proxy_params;
    }

    location ~ ^/card/.+/remove-link$ {
        limit_req zone=write_zone burst=2;
        proxy_pass http://flashcards;
        include    /etc/nginx/proxy_params;
    }

    # Everything else
    location / {
        proxy_pass http://flashcards;
        include    /etc/nginx/proxy_params;
    }

    # Compression — cuts HTML + JSON transfer by ~70 %
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/html text/plain text/css
        application/json application/javascript
        text/javascript image/svg+xml;
}
